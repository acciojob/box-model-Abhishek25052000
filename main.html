<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Document</title>
		<style>
			.a1{
				height:100px;
				width:100px;
				border:1px solid green;
			    border-radius:50px;
				background-color:green;
				margin-left:50px;
			}
			.a2{
				height:100px;
				width:100px;
				border:1px solid yellow;
			    border-radius:50px;
				background-color:yellow;
				margin-left:10px;
			}
			.a3{
				height:100px;
				width:100px;
				border:1px solid red;
			    border-radius:50px;
				background-color:red;
				margin-left:10px;
			}
			.container{
				height:200px;
				width:500px;
				border:5px solid black;
				border-radius:40px;
				background-color:rgb(236, 226, 226);
				display:flex;
				flex-direction:row;
			}
			.q1{
				display:flex;
				flex-direction:row;
				padding-left:15px;
				align-items:center;
				text-align:center;
				margin-left:20px;
				margin-right:50px;			
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="q1">
			<div class="a1">
			</div>
			<div class="a2">
			</div>
		    <div class="a3">
			</div>
			</div>
		</div>
		
	</body>
</html>
